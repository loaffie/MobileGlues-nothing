name: Build Spike Catcher

on:
  push:
    paths:
      - "spike-catcher/**"
      - ".github/workflows/build-spike-catcher.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: spike-catcher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          # Loom 1.18 itself needs Java 25 to run; the mod is still compiled for Java 21.
          distribution: microsoft
          java-version: "25"

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: spike-catcher-${{ github.sha }}
          path: spike-catcher/build/libs/spike-catcher-*.jar
